server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Brevo HTTP API key (no SMTP needed — bypasses Render port blocking)
brevo.api.key=${BREVO_API_KEY}

app.reminder.sender=paidilavanya00@gmail.com
jwt.secret=${JWT_SECRET:myTaskManagerSuperSecretKey2026ForJWT}
app.frontend.url=${APP_FRONTEND_URL:https://task-manager-fullstack-gray-six.vercel.app}

spring.jpa.open-in-view=false